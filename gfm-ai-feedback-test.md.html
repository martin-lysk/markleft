# GFM AI Feedback Test

This document is intentionally dense: it gives an AI-generated Markdown draft many places where a reviewer might leave precise feedback. It includes prose, tables, task lists, links, footnotes, images, HTML, Mermaid, and edge cases around punctuation, formatting, and references.

## Review Targets

- [x] Keep the executive summary short and actionable.
- [ ] Verify all links and image references.
- [ ] Check whether tables remain readable on narrow screens.
- [ ] Confirm the Mermaid diagram is useful even when rendered as a code block.

## Formatting Mix

The same sentence mixes **bold claims**, _soft emphasis_, `inline code`, ~~removed wording~~, <kbd>keyboard hints</kbd>, and a regular footnote reference.

Autolinks should stay clickable: <https://github.github.com/gfm/>

Raw URL text should remain readable: <https://github.com/openai>

## Tables

| Feature | Good AI Behavior | Reviewer Feedback Prompt |
| --- | --- | --- |
| Tables | Keeps pipes and alignment valid | Select across cells and leave a range comment |
| Task lists | Preserves checkbox state | Ask the AI to split broad tasks |
| Images | Leaves alt text meaningful | Ask for better accessibility wording |
| Links | Keeps reference targets intact | Flag dead or vague links |

## Blockquotes

> A quoted recommendation can span multiple paragraphs.
> 
> Reviewers often need to select from the end of one quoted paragraph into the beginning of the next.

## Code

Inline JSON: `{"status":"draft","reviewed":false}`

``` js
const review = {
  audience: "LLM plus human reviewer",
  risk: "format drift",
  checks: ["tables", "links", "images", "comments"],
};

console.log(review.checks.join(", "));
```

``` diff
- The answer is probably good enough.
+ The answer needs a concrete source and a tighter claim.
```
