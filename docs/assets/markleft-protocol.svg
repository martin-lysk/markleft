<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MarkLeft annotation and suggestion protocol</title>
  <desc id="desc">A Markdown document keeps its original blocks while typed footnote comments and append-only suggestion definitions feed a rich HTML review view.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f6ec"/><stop offset="1" stop-color="#eef5f2"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#385760"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17343d" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" filter="url(#shadow)">
    <g transform="translate(52 65)"><rect width="430" height="490" rx="22" fill="#fffdf8" stroke="#718e91" stroke-width="3"/><text x="28" y="45" font-family="ui-rounded,system-ui,sans-serif" font-size="23" font-weight="700" fill="#244750">Markdown stays canonical</text><rect x="25" y="70" width="380" height="105" rx="12" fill="#edf4f1"/><text x="43" y="101" font-size="15" fill="#31545d">&lt;!-- markleft:block id="babf825b" --&gt;</text><text x="43" y="132" font-size="15" fill="#31545d">![Pelican](pelican-v1.svg)</text><text x="43" y="157" font-size="15" fill="#ba6638">[^image-5233-2528-...]</text><rect x="25" y="198" width="380" height="94" rx="12" fill="#fff0df"/><text x="43" y="229" font-size="15" fill="#8a4c2e">[^image-5233-2528-...]:</text><text x="43" y="257" font-size="15" fill="#31545d">    the head looks strange</text><rect x="25" y="316" width="380" height="145" rx="12" fill="#eeeaff"/><text x="43" y="347" font-size="14" fill="#5146a3">[^suggestion-s2-update-block-</text><text x="43" y="370" font-size="14" fill="#5146a3">babf825b]:</text><text x="43" y="401" font-size="15" fill="#31545d">    ![Pelican](pelican-v2.svg)</text><text x="43" y="433" font-size="14" fill="#ba6638">    [^image-5233-2528-...]</text></g>
  </g>
  <g fill="none" stroke="#385760" stroke-width="5" marker-end="url(#arrow)"><path d="M505 190h110"/><path d="M505 387h110"/></g>
  <g transform="translate(636 65)" font-family="ui-rounded,system-ui,sans-serif" filter="url(#shadow)"><rect width="512" height="490" rx="22" fill="#fffdf8" stroke="#718e91" stroke-width="3"/><text x="30" y="45" font-size="23" font-weight="700" fill="#244750">HTML becomes the review workspace</text><rect x="30" y="76" width="452" height="300" rx="16" fill="#d9edf2"/><rect x="48" y="94" width="416" height="264" rx="12" fill="#82c6d1"/><path d="M48 258c72-30 130 8 204-14s138-8 212 18v96H48z" fill="#e4cc98"/><circle cx="354" cy="151" r="43" fill="#fffdf3" stroke="#31545d" stroke-width="5"/><path d="M323 159c-42-6-82 5-110 26 39 13 89 10 127-9z" fill="#f4a261" stroke="#31545d" stroke-width="5"/><circle cx="369" cy="142" r="6" fill="#17343d"/><circle cx="181" cy="302" r="45" fill="none" stroke="#17343d" stroke-width="7"/><circle cx="371" cy="302" r="45" fill="none" stroke="#17343d" stroke-width="7"/><path d="M181 302l78-10 46-71 32 81H181l49-81h75" fill="none" stroke="#087f8c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 76v300" stroke="#fff" stroke-width="4"/><circle cx="256" cy="227" r="19" fill="#d77843" stroke="#fff" stroke-width="4"/><circle cx="365" cy="139" r="15" fill="#fff1dc" stroke="#d77843" stroke-width="4"/><text x="365" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4728">1</text><text x="30" y="417" font-size="17" font-weight="700" fill="#244750">Original + suggestion + intent</text><text x="30" y="449" font-size="16" fill="#587078">Accept, reject, or refine—without losing context.</text></g>
  <text x="600" y="595" text-anchor="middle" font-family="ui-rounded,system-ui,sans-serif" font-size="17" fill="#385760">Stable IDs locate blocks · Typed footnotes locate intent · Suggestions only append</text>
</svg>
